<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聯絡我們｜青山 PEAK TEA</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .contact-form { display:grid; gap:16px; max-width:520px; }
  .contact-form label { font-size:.88rem; color:var(--muted); display:block; margin-bottom:6px; }
  .contact-form input, .contact-form textarea {
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    font-family:inherit; font-size:.95rem; background:#fff;
  }
  .contact-form textarea { min-height:120px; resize:vertical; }
</style>
</head>
<body data-page="contact.html">

<div id="site-header"></div>

<main>
  <div class="container content-page">
    <p class="eyebrow" style="color:var(--accent); letter-spacing:.3em; font-size:.82rem;">CONTACT</p>
    <h1>聯絡我們</h1>
    <p class="lead">有任何加盟、合作或品牌相關問題，歡迎與我們聯繫。</p>

    <div class="content-block">
      <h2>客服資訊</h2>
      <p>客服專線：02-2345-6789（週一至週日 10:00-21:30）</p>
      <p>Email：hello@peak-tea.com</p>
    </div>

    <div class="content-block">
      <h2>線上留言</h2>
      <form class="contact-form" id="contactForm">
        <div><label for="name">姓名</label><input id="name" required></div>
        <div><label for="email">Email</label><input id="email" type="email" required></div>
        <div><label for="msg">訊息內容</label><textarea id="msg" required></textarea></div>
        <button class="btn btn-primary" type="submit" style="justify-self:start;">送出訊息</button>
      </form>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/user.js"></script>
<script type="module" src="js/layout.js"></script>
<script>
  document.getElementById('contactForm').addEventListener('submit', (e) => {
    e.preventDefault();
    showToast('感謝您的來信，我們將盡快與您聯繫！');
    e.target.reset();
  });
</script>
</body>
</html>
